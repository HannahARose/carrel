# Weekly dependency updates, as pull requests into dev. Minor and patch updates are grouped
# into one pull request per ecosystem; major updates come one by one.
# Each release waits a week first, so a compromised version is likely caught and pulled before
# it is proposed.
# The Swift package (apple/CarrelKit) has no dependencies of its own yet.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust:
        update-types: [minor, patch]
    labels: ["type: task", "area: core"]
    commit-message:
      prefix: "Update"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    labels: ["type: task", "area: ci"]
    commit-message:
      prefix: "Update"
