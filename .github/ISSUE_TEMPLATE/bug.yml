name: Bug report
description: Something in Carrel doesn't work as expected
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste the contents of private documents; describe the file instead (type, size, structure).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `carrel ingest ~/Downloads/example.pdf`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - macOS app
        - iPadOS app
        - iOS app
        - carrel CLI
        - Archive files (cards, FORMAT.md, history)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Carrel version or commit, OS version, device.
      placeholder: "carrel 0.1.0 (abc1234), macOS 27.2, M4 Max"
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant output. Use `carrel --agent-safe` where available to strip personal details.
      render: text
