name: Feature request
description: Propose a new capability or an improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How Carrel could solve it. Mockups or example commands welcome.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      description: Check the ones this proposal affects (see the wiki's Design Principles page).
      options:
        - label: Changes the archive format or what is readable without the app
        - label: Sends data off the device or touches the privacy filter
        - label: Adds automation that acts without asking
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
