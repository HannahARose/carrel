name: Labeler

# Adds area: labels to pull requests from the files they change (.github/labeler.yml).
# pull_request_target so it can label pull requests from forks too; it never checks out or
# runs their code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
