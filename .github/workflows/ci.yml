name: CI

# Which jobs run when (docs/dev/development-setup.md, "Which CI jobs run when"):
#
# - The "Changes" job (.github/scripts/ci-changes.sh) lists the files a pull request or push
#   changes and says which areas they touch. Each job below runs only for its area: a docs-only
#   change runs Format, Docs hygiene and nothing else. Format and Docs hygiene always run.
# - Everything runs for a change to any workflow, the weekly schedule, a manual run and a pull
#   request into main (or a merge queue's group into main).
# - A merge queue's group (merge_group, #298) runs the jobs for what the group changes against
#   its base, and "CI passed" reports on it, since the queue waits for that check.
# - A push to dev (a merged pull request) runs the Linux jobs for what that merge changed,
#   which keeps their caches warm. Its macOS and Windows jobs run only when the dependencies
#   changed, to refresh those caches: the merge queue has already tested that exact commit on
#   every platform. Each push gets its own run, so a later merge can't cancel an earlier one.
# - Caches are restored everywhere and saved only on dev, so pull requests don't evict them.
#   Pull requests into main restore none: a release is checked from a clean build.
# - A pull request into dev runs only the Linux jobs: the macOS and Windows ones (and their
#   matrix entries) run once, in the merge queue's group, so a session's pushes and merges of
#   dev don't queue for the few macOS runners. Nothing reaches dev without the queue, so
#   nothing unchecked lands. A pull request into main still runs everything.
# - Coverage, which reports and never fails on a number, waits for a ready pull request.
#   Performance benchmarks are their own workflow (perf.yml), on dev only.
# - "CI passed" is the required check. It passes when every job passed or was skipped because
#   its area didn't change, and fails if "Changes" itself failed.

on:
  pull_request:
    branches: [dev, main]
    # ready_for_review: Coverage runs when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # main gets only merges of dev that its pull request has already checked from scratch.
  push:
    branches: [dev]
  # The merge queue's combined commits, once the queue is on (#298).
  merge_group:
  workflow_dispatch:
  # Weekly, so new security advisories against existing dependencies show up even when
  # nothing changes.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read # check out the code

concurrency:
  # A pull request's newer push cancels its older run; every push to dev and every merge
  # queue group runs to the end.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      swift: ${{ steps.areas.outputs.swift }}
      app: ${{ steps.areas.outputs.app }}
      mlx: ${{ steps.areas.outputs.mlx }}
      swift-format: ${{ steps.areas.outputs.swift_format }}
      llama: ${{ steps.areas.outputs.llama }}
      cad: ${{ steps.areas.outputs.cad }}
      extract: ${{ steps.areas.outputs.extract }}
      kopia: ${{ steps.areas.outputs.kopia }}
      editors: ${{ steps.areas.outputs.editors }}
      deny: ${{ steps.areas.outputs.deny }}
      workflows: ${{ steps.areas.outputs.workflows }}
      cache: ${{ steps.areas.outputs.cache }}
      save: ${{ steps.areas.outputs.save }}
      # "false" for a pull request into dev, whose macOS and Windows jobs run in the merge queue,
      # and for a push to dev that leaves the dependencies as they were.
      heavy: ${{ steps.weight.outputs.heavy }}
      # Matrix entries to leave out for a pull request into dev: macOS and Windows.
      light-exclude: ${{ steps.weight.outputs.exclude }}
      # The platforms for jobs that run on all three: only Linux for a pull request into dev.
      oses: ${{ steps.weight.outputs.oses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a push's earlier commit, and a pull request's base
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          # A pull request's base branch, or a merge queue group's (refs/heads/...).
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          SHA: ${{ github.sha }}
        run: .github/scripts/ci-changes.sh
      - id: weight
        env:
          INTO_DEV: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
          PUSH: ${{ github.event_name == 'push' }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # A push to dev is a merge the queue has just tested exactly, so its macOS and Windows
          # jobs would only repeat that run and take the few macOS runners from pull requests.
          # They run on a push only when the dependencies change, to refresh those caches (the
          # weekly run refreshes them too).
          light_push=false
          if [ "$PUSH" = true ]; then
            light_push=true
            if ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
              || git diff --name-only "$BEFORE" "$SHA" \
              | grep -qE '(^|/)(Cargo\.lock|Package\.resolved|rust-toolchain\.toml)$'; then
              light_push=false
            fi
          fi
          if [ "$INTO_DEV" = true ] || [ "$light_push" = true ]; then
            {
              echo "heavy=false"
              echo 'exclude=[{"os":"macos-latest"},{"os":"windows-latest"}]'
              echo 'oses=["ubuntu-latest"]'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "heavy=true"
              echo 'exclude=[]'
              echo 'oses=["macos-latest","ubuntu-latest","windows-latest"]'
            } >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      # The llama.cpp provider has its own job: building llama.cpp takes minutes.
      - run: cargo clippy --workspace --exclude carrel-provider-llama --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        exclude: ${{ fromJSON(needs.changes.outputs.light-exclude) }}
        # macOS is the main platform; Linux and Windows keep the core and CLI portable.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - run: cargo test --workspace --exclude carrel-provider-llama --all-targets --locked --no-fail-fast
      - run: cargo test --workspace --exclude carrel-provider-llama --doc --locked
      - name: CLI reports its version
        run: cargo run --locked --bin carrel -- --version

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links and other rustdoc warnings fail the build, including links in
      # private items' docs.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - run: cargo doc --workspace --exclude carrel-provider-llama --no-deps --document-private-items --locked

  coverage:
    # Line coverage of the Rust workspace's tests on Linux, written to the job summary: the
    # total, each crate, and the lines the change added. Report only: no number fails it, and
    # failing tests don't either (Test reports those). It runs on ready pull requests that touch
    # Rust, never on drafts, and on pushes to dev, which save its cache.
    name: Coverage
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      && ((github.event_name == 'pull_request' && !github.event.pull_request.draft)
        || needs.changes.outputs.save == 'true')
    runs-on: ubuntu-latest
    env:
      # cargo-llvm-cov's release, checked against its checksum.
      LLVM_COV_VERSION: "0.9.1"
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's base, the merge's first parent
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: |
          file="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
          curl -sSfL -o "$file" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LLVM_COV_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" -C "$HOME/.cargo/bin"
          cargo llvm-cov --version
      - name: Measure
        # As the Test job runs them, without llama.cpp; the tests' own files aren't counted.
        run: |
          cargo llvm-cov --workspace --exclude carrel-provider-llama --locked --ignore-run-fail \
            --ignore-filename-regex '/(tests|benches|examples)/' \
            --lcov --output-path target/lcov.info
      - name: Summary
        env:
          # A pull request's change against its base; a push reports only the totals.
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range=(HEAD^1 HEAD)
          else
            range=()
          fi
          # The summary goes to the job summary; its ::notice line to the log, as an annotation.
          python3 .github/scripts/coverage-summary.py target/lcov.info ${range[@]+"${range[@]}"} \
            >> "$GITHUB_STEP_SUMMARY"

  swift:
    # The Swift side: build the XCFramework and bindings, test them from Swift, check the
    # package also builds for iOS, and test the Apple provider on its own and through Carrel.
    name: Swift package
    needs: changes
    if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches target/, including each Apple target's build under target/<triple>.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      # SwiftPM and Xcode build products of both packages. Restored from dev's latest, saved only on dev. The key names the Xcode
      # version, since a build from another Xcode can't be reused.
      - name: Xcode version
        id: xcode
        if: needs.changes.outputs.cache == 'true'
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the Swift build
        id: swift-cache
        if: needs.changes.outputs.cache == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelKit/.build
            apple/CarrelProviders/.build
            !apple/*/.build/xcode/Logs
          key: swift-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelKit/Package.swift', 'apple/CarrelProviders/Package.swift') }}-${{ hashFiles('apple/CarrelKit/Sources/**', 'apple/CarrelKit/Tests/**', 'apple/CarrelProviders/Sources/**', 'apple/CarrelProviders/Tests/**') }}
          restore-keys: swift-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelKit/Package.swift', 'apple/CarrelProviders/Package.swift') }}-
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build the XCFramework and Swift bindings
        run: PROFILE=dev scripts/build-xcframework.sh
      - name: Generated bindings are up to date
        # The build regenerated the committed bindings; any difference means they're stale.
        run: |
          generated=apple/CarrelKit/Sources/CarrelKit/Generated
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            git status --short -- "$generated"
            git diff -- "$generated"
            echo "::error::The Swift bindings in $generated are out of date. Run scripts/generate-bindings.sh and commit the result."
            exit 1
          fi
      - name: Swift tests
        working-directory: apple/CarrelKit
        run: swift test
      - name: Build for the iOS Simulator
        working-directory: apple/CarrelKit
        run: xcodebuild -scheme CarrelKit -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode build
      - name: Apple provider tests
        working-directory: apple/CarrelProviders
        run: swift test
      - name: Apple provider through the provider protocol
        run: |
          bin="$(swift build --package-path apple/CarrelProviders --show-bin-path)"
          swift build --package-path apple/CarrelProviders --product carrel-provider-apple
          CARREL_TEST_APPLE_PROVIDER="$bin/carrel-provider-apple" cargo test --locked -p carrel-core --test apple_provider
          PATH="$bin:$PATH" cargo run --locked --bin carrel -- providers
      - name: Save the Swift build
        if: needs.changes.outputs.save == 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelKit/.build
            apple/CarrelProviders/.build
            !apple/*/.build/xcode/Logs
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  app:
    # The Mac app (apple/CarrelApp): its tests, then a development build, signed ad hoc and
    # kept as the "Carrel" artifact for 30 days. Developer ID signing and notarization wait
    # for v1.0 (#47), so there are no signing secrets here.
    name: Mac app
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      # The app's Xcode build products. Restored from dev's latest, saved only on dev. The key names the Xcode
      # version, since a build from another Xcode can't be reused.
      - name: Xcode version
        id: xcode
        if: needs.changes.outputs.cache == 'true'
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the Swift build
        id: swift-cache
        if: needs.changes.outputs.cache == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelApp/.build/xcode
            !apple/CarrelApp/.build/xcode/Logs
          key: app-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelApp/CarrelApp.xcodeproj/project.pbxproj', 'apple/CarrelKit/Package.swift') }}-${{ hashFiles('apple/CarrelApp/**', 'apple/CarrelKit/Sources/**') }}
          restore-keys: app-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelApp/CarrelApp.xcodeproj/project.pbxproj', 'apple/CarrelKit/Package.swift') }}-
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build the XCFramework
        run: scripts/build-xcframework.sh
      - name: App tests
        run: |
          xcodebuild -project apple/CarrelApp/CarrelApp.xcodeproj -scheme Carrel \
            -derivedDataPath apple/CarrelApp/.build/xcode test
      - name: Build the app
        run: |
          xcodebuild -project apple/CarrelApp/CarrelApp.xcodeproj -scheme Carrel \
            -configuration Release -derivedDataPath apple/CarrelApp/.build/xcode build
          app=apple/CarrelApp/.build/xcode/Build/Products/Release/Carrel.app
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" target/Carrel.zip
      - name: Save the Swift build
        if: needs.changes.outputs.save == 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelApp/.build/xcode
            !apple/CarrelApp/.build/xcode/Logs
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Carrel
          path: target/Carrel.zip
          retention-days: 30
          if-no-files-found: error

  swift-format:
    # Swift style, as set in .swift-format. swift-format comes with Xcode.
    name: Swift format
    needs: changes
    if: needs.changes.outputs.swift-format == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          if ! scripts/swift-format.sh --check; then
            echo "::error::Swift under apple/ isn't formatted. Run scripts/swift-format.sh and commit the result."
            exit 1
          fi

  mlx:
    # The MLX provider (apple/CarrelMLX). MLX's Metal shaders need xcodebuild, not swift build.
    # Hosted runners can't run a model, so this builds it and runs the tests that need none;
    # the on-device runner drafts with real MLX models.
    name: MLX provider
    needs: changes
    if: needs.changes.outputs.mlx == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Metal Toolchain
        # Xcode ships the Metal compiler as a separate component.
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q "Status: installed" \
            || xcodebuild -downloadComponent MetalToolchain
      # SwiftPM's packages (mlx-swift and the rest) and their Xcode build products. Restored from dev's latest, saved only on dev. The key names the Xcode
      # version, since a build from another Xcode can't be reused.
      - name: Xcode version
        id: xcode
        if: needs.changes.outputs.cache == 'true'
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the Swift build
        id: swift-cache
        if: needs.changes.outputs.cache == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelMLX/.build/xcode
            !apple/CarrelMLX/.build/xcode/Logs
          key: mlx-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelMLX/Package.resolved') }}-${{ hashFiles('apple/CarrelMLX/Package.swift', 'apple/CarrelMLX/Sources/**', 'apple/CarrelMLX/Tests/**', 'apple/CarrelProviders/Package.swift', 'apple/CarrelProviders/Sources/**') }}
          restore-keys: mlx-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/CarrelMLX/Package.resolved') }}-
      - name: Build and test
        working-directory: apple/CarrelMLX
        run: |
          xcodebuild -scheme CarrelMLX-Package -destination 'platform=macOS' \
            -derivedDataPath .build/xcode -skipMacroValidation test
      - name: Save the Swift build
        if: needs.changes.outputs.save == 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/CarrelMLX/.build/xcode
            !apple/CarrelMLX/.build/xcode/Logs
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  deny:
    # Known vulnerabilities, unmaintained or yanked crates, licenses, duplicate versions and
    # crate sources, as set in deny.toml.
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # The release's license notices (cargo-about, about.toml) accept what deny.toml allows.
      - run: python3 .github/scripts/check-license-lists.py

  zizmor:
    # Security problems in the workflows themselves, such as injection or broad permissions.
    name: Workflow audit
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Print findings and fail, rather than uploading them to code scanning.
          advanced-security: false
      - name: No pull requests on the owner's Mac
        # The self-hosted runner (docs/design/on-device-ci.md) runs code on the owner's
        # machine, so no workflow that names its label may run for pull requests.
        run: |
          status=0
          label="carrel-on-""device" # split, so this check doesn't find itself
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            grep -v '^[[:space:]]*#' "$file" | grep -q "runs-on:.*$label" || continue
            if grep -v '^[[:space:]]*#' "$file" | grep -q 'pull_request'; then
              echo "::error file=$file::$file uses the self-hosted runner and runs on pull requests"
              status=1
            fi
          done
          exit $status

  hygiene:
    # Spelling (_typos.toml), Markdown style (.markdownlint-cli2.yaml) and links in the
    # project's documents.
    name: Docs hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Pull requests check links within the repository only, so another site being
          # down can't fail them; the weekly run checks every link.
          args: >-
            --no-progress --include-fragments
            ${{ github.event_name != 'schedule' && '--offline' || '' }}
            README.md CONTRIBUTING.md FORMAT.md fixtures/README.md 'docs/**/*.md' 'apple/**/*.md'
          jobSummary: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

  llama:
    # The portable model provider, with llama.cpp built in, run against a tiny test model.
    name: llama.cpp provider (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    strategy:
      fail-fast: false
      matrix:
        exclude: ${{ fromJSON(needs.changes.outputs.light-exclude) }}
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A 1 MB model whose answers are nonsense: enough to test loading, generation and
      # grammar-constrained JSON.
      MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - run: cargo clippy -p carrel-provider-llama --all-targets --locked -- -D warnings
      - name: Download the test model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSfL -o "$RUNNER_TEMP/models/stories260K.gguf" "$MODEL_URL"
          echo "$MODEL_SHA256  $RUNNER_TEMP/models/stories260K.gguf" | shasum -a 256 -c -
      - name: Tests
        run: CARREL_TEST_LLAMA_MODELS="$RUNNER_TEMP/models" cargo test -p carrel-provider-llama --locked
      - name: Through carrel providers
        run: |
          cargo build -p carrel-provider-llama -p carrel-cli --locked
          CARREL_MODELS_DIR="$RUNNER_TEMP/models" PATH="$PWD/target/debug:$PATH" cargo run --locked --bin carrel -- providers

  cad:
    # The CAD provider with OpenCascade from each platform's package manager, so STEP and IGES
    # drawing is tested rather than skipped.
    name: CAD provider (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    strategy:
      fail-fast: false
      matrix:
        exclude: ${{ fromJSON(needs.changes.outputs.light-exclude) }}
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARREL_REQUIRE_OPENCASCADE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - name: Install OpenCascade
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install opencascade
          else
            sudo apt-get update -q
            sudo apt-get install -yq libocct-data-exchange-dev libocct-modeling-algorithms-dev
          fi
      - run: cargo clippy -p carrel-provider-cad --all-targets --locked -- -D warnings
      - run: cargo test -p carrel-provider-cad --locked

  extract:
    # The portable extraction provider with Tesseract and Poppler installed, so OCR of images
    # and scanned PDFs is tested rather than skipped.
    name: Portable extraction
    needs: changes
    if: needs.changes.outputs.extract == 'true'
    runs-on: ubuntu-latest
    env:
      CARREL_REQUIRE_TESSERACT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - name: Install Tesseract and Poppler
        run: sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr poppler-utils
      - run: cargo test -p carrel-provider-extract --locked

  editors:
    # The Neovim plugin and the Emacs package (editors/) against a fake carrel that prints
    # fixture JSON: headless Neovim tests, ERT, a byte-compile with warnings as errors,
    # checkdoc and package-lint. Neovim and Emacs come from Ubuntu's own packages.
    name: Editor plugins
    needs: changes
    if: needs.changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Neovim and Emacs
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends neovim emacs-nox elpa-package-lint
      - run: editors/test/run.sh

  kopia:
    # Backups against the real kopia program and a throwaway filesystem repository.
    name: Kopia backups (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.kopia == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Kopia's release for each platform, looked up by matrix.os (a draft runs only Linux).
      ASSET: ${{ fromJSON('{"macos-latest":"kopia-0.23.1-macOS-arm64","ubuntu-latest":"kopia-0.23.1-linux-x64","windows-latest":"kopia-0.23.1-windows-x64"}')[matrix.os] }}
      SHA256: ${{ fromJSON('{"macos-latest":"19e6ed637221f4dfd46a46e978ec4c509c386b522d746db2cd6762b217478111","ubuntu-latest":"416d0f84a3dbb321a8b2d8f0997b1a0a6e915babe79ee76fa6e4d2bd1e1c5178","windows-latest":"f0369d9657dbe47a1b8b6ff4e308c5958a4813b405d4e32ae9d81b3f2b3d8251"}')[matrix.os] }}
      ARCHIVE: ${{ matrix.os == 'windows-latest' && 'zip' || 'tar.gz' }}
      KOPIA_CHECK_FOR_UPDATES: "false"
      CARREL_REQUIRE_KOPIA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.cache == 'true'
        with:
          save-if: ${{ needs.changes.outputs.save == 'true' }}
      - name: Install Kopia
        run: |
          file="$RUNNER_TEMP/kopia.$ARCHIVE"
          curl -sSfL -o "$file" "https://github.com/kopia/kopia/releases/download/v0.23.1/$ASSET.$ARCHIVE"
          if command -v sha256sum > /dev/null; then
            echo "$SHA256  $file" | sha256sum -c -
          else
            echo "$SHA256  $file" | shasum -a 256 -c -
          fi
          if [ "$ARCHIVE" = zip ]; then
            unzip -q "$file" -d "$RUNNER_TEMP"
          else
            tar -xzf "$file" -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/$ASSET" >> "$GITHUB_PATH"
      - run: kopia --version
      - name: Tests
        run: cargo test -p carrel-core --test backup_kopia --locked

  ok:
    # The single required check for branch protection. It passes only if "Changes" passed and
    # every other job above passed or was skipped because its area didn't change. A job whose
    # area changed can only be skipped if "Changes" failed, which this catches.
    # A push to dev reports under another name: it runs on the same commit a release pull
    # request into main is opened from, and its result must not stand in for that pull
    # request's own clean run of every job. Pull requests and merge queue groups report as
    # "CI passed", the required check.
    name: ${{ github.event_name == 'push' && 'Dev check' || 'CI passed' }}
    if: always()
    needs: [changes, fmt, clippy, test, docs, coverage, swift, app, swift-format, mlx, llama, cad, extract, kopia, editors, deny, zizmor, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$NEEDS"
          [ "$FAILED" = "false" ]
