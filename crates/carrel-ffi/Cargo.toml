[package]
name = "carrel-ffi"
description = "Swift bindings for carrel-core, generated with UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# `lib` for Rust tests, `staticlib` for the XCFramework, `cdylib` so uniffi-bindgen can read
# the interface from the built library.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
carrel-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32"

[lints]
workspace = true
