[package]
name = "carrel-core"
description = "Read and write Carrel archives: format, cards, manifests, history and the archive operations shared by every Carrel app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5.3"
filetime = "0.2.29"
flate2 = "1.1.10"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.38"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz"] }
regex = "1.13.1"
ruzstd = "0.9.1"
schemars = { version = "1", features = ["indexmap2", "preserve_order", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
uuid = { version = "1.29.0", features = ["serde", "v7"] }
zip = { version = "9.1.3", default-features = false, features = ["bzip2", "deflate-flate2", "jiff-02"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }

[lints]
workspace = true

# Performance benchmarks with a timing harness of their own (benches/scale/main.rs).
[[bench]]
name = "scale"
harness = false

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "encoder"] }
proptest = "1"
tempfile = "3.27.0"
