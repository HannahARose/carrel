[package]
name = "carrel-cli"
description = "The carrel command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "carrel"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
carrel-core.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
uuid = "1.29.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
