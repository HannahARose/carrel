# cargo-about: the third-party license notices shipped with release builds
# (scripts/third-party-licenses.sh). Accepted licenses match deny.toml's.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what ends up in the programs: not build tools or test-only crates, nor Carrel's own.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
