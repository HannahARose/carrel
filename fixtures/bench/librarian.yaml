# Questions for the librarian, with known answers (docs/design/librarian.md, "Measuring it";
# docs/design/benchmark.md).
#
# Written by hand, the way the owner would ask. Each lists the items that should come back
# and the facts the answer must state. A fact is a phrase, or a list of phrases any one of
# which counts; it's found when the answer says it, ignoring case, spacing and punctuation.
#
# restricted: for each restricted item in answers.yaml, text that must never show in an
# answer. Runs of six or more words from a restricted item's text count as showing too.
